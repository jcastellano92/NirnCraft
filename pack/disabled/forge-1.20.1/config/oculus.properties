#NirnCraft: enable Complementary Reimagined by default (Oculus 1.8 keys; the file Oculus reads is config/oculus.properties).
#Players can switch shaders off in Video Settings > Shader Packs (or with the K key); Oculus keeps their choice.
colorSpace=SRGB
disableUpdateMessage=true
enableDebugOptions=false
maxShadowRenderDistance=32
shaderPack=ComplementaryReimagined_r5.9.3.zip
enableShaders=true
