# Skycraft defaults for Distant Horizons 3.3.x. Distant Horizons fills in every other option on first launch.
# _version must match the mod's config version (5 for 3.3.x), otherwise Distant Horizons deletes the file.
# Full-pack QA (docs/PLAYTEST-FULLPACK.md): DH's world-gen threads sat idle ~89% of the time at LOW_IMPACT, so a
# heavier thread preset would not build LODs faster; it would only take CPU from the game.
_version = 5

[client]
	# Use about a quarter of the CPU threads for LOD building (Steam Deck friendly).
	threadPresetSetting = "LOW_IMPACT"

	[client.advanced.graphics.quality]
		# LOD render distance in chunks (32-4096, default 256). 128 chunks = 2 km of Tamriel; desktops with a fast
		# GPU and 8 GB+ of heap can raise it to 256.
		lodChunkRenderDistanceRadius = 128

	[client.advanced.graphics.fog]
		# Blend distant LOD terrain into Skycraft's regional and twilight fog color (ClientWeather) without a hard seam.
		colorMode = "USE_WORLD_FOG_COLOR"
		farFogStart = 0.35
		farFogMax = 1.0
		farFogFalloff = "EXPONENTIAL_SQUARED"

	[client.advanced.graphics.ssao]
		# Complementary Reimagined handles AO; disabling DH SSAO prevents depth-buffer halo artifacts around sky particles.
		enableSsao = false

	[client.advanced.graphics.genericRendering]
		# Complementary Reimagined renders Skycraft's 3D volumetric clouds; disable vanilla-style DH box clouds.
		enableCloudRendering = false

	[client.advanced.autoUpdater]
		# The pack pins Distant Horizons; never download a different version at launch.
		enableAutoUpdater = false
		enableSilentUpdates = false

[common.worldGenerator]
	# Generate distant terrain with features (trees, plants) but without structures.
	chunkGeneratorMode = "FEATURES"
	# Rough surface first (a quick horizon), then real chunks fill in trees and correct heights. The rough pass can
	# sit a few blocks off Skycraft's real terrain for the first minute in a new area; the chunk pass replaces it.
	generatorPlan = "SURFACE_THEN_CHUNKS"

	[common.logging.warning]
		# The pack ships G1 with tuned flags (a concurrent collector isn't available in every Java 17 build), so the
		# chat warning about it is noise the player can't act on.
		showGarbageCollectorWarning = false
