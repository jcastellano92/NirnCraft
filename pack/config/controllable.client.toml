# Controllable 0.21.x client config (Framework config "controllable:client").
# Skycraft defaults for the Steam Deck: Steam button icons, virtual mouse cursor in menus, all button hints.
# Keys Skycraft doesn't set are filled in by Framework with Controllable's defaults on first launch.

[client.options]
	controllerIcons = "STEAM"
	virtualMouse = true
	mouseSpeed = 15.0
	showActions = "ALL"
