modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional: load after Vampirism so Skycraft's data overrides win (its hunter outposts are disabled through their
# biome tags in data/vampirism/tags/worldgen/biome/has_structure/outpost/).
[[dependencies.${mod_id}]]
    modId="vampirism"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="BOTH"
