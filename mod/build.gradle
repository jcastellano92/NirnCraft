plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

// Opt-in fast scratch storage. Keep the default path for existing QA/dev tools.
if (providers.gradleProperty('nirncraftBuildDir').isPresent()) {
    layout.buildDirectory.set(file(providers.gradleProperty('nirncraftBuildDir').get()))
} else {
    // The owner's checkout lives on a slow HDD: a plain `gradlew` (any tool, any agent) must not build there. mod/build
    // becomes a directory junction to fast storage (one target per checkout, so worktrees never share outputs); every
    // tool that reads mod/build keeps working. NIRNCRAFT_FAST_BUILD_ROOT moves it; machines without that storage (no
    // E:\NirnCraft-scratch, not Windows) keep the plain directory.
    def fastRoot = new File(System.getenv('NIRNCRAFT_FAST_BUILD_ROOT') ?: 'E:/NirnCraft-scratch/checkout-builds')
    def link = file('build')
    if (System.getProperty('os.name').toLowerCase().contains('win') && fastRoot.parentFile?.isDirectory()) {
        def key = Integer.toHexString(projectDir.canonicalPath.toLowerCase().hashCode())
        def target = new File(fastRoot, key)
        if (!link.exists()) {
            target.mkdirs()
            def p = ['cmd', '/c', 'mklink', '/J', link.absolutePath, target.absolutePath].execute()
            p.waitFor()
            if (p.exitValue() != 0) logger.warn("NirnCraft: could not link mod/build to ${target}: ${p.err.text}")
        } else if (link.canonicalPath == link.absolutePath) {
            logger.warn("NirnCraft: mod/build is a real directory on the checkout's disk (slow HDD). Delete it and the " +
                    "next build puts it on fast storage (${target}), or build with tools/dev/build_263.py.")
        }
    }
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

neoForge {
    version = neo_version
    runs {
        configureEach {
            gameDirectory = project.file(project.findProperty('nirncraftRunDir') ?: 'run/26.3')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            if (project.findProperty('nirncraftDevDir')) {
                systemProperty 'nirncraft.dev', project.file(project.property('nirncraftDevDir')).absolutePath
            }
            logLevel = org.slf4j.event.Level.DEBUG
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
        }
        data {
            clientData()
            gameDirectory = project.file('run-data/26.3')
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }
    }
    mods { nirncraft { sourceSet(sourceSets.main) } }
    unitTest {
        // Real FML bootstrap and registry ownership, supplied by this exact NeoForge userdev artifact.
        enable()
        testedMod = mods.nirncraft
    }
}

// MDG 2.0.148 hardcodes the JUnit cwd relative to the project, independent of buildDirectory.
// Configure its public DirectoryProperty and follow its afterEvaluate working-directory assignment.
def nativeJunitDirectory = layout.buildDirectory.dir('minecraft-junit')
tasks.named('prepareNeoForgeTestFiles').configure {
    gameDirectory.set(nativeJunitDirectory)
}
afterEvaluate {
    tasks.named('test', Test).configure {
        workingDir(nativeJunitDirectory.get().asFile)
        def nativeTestTemp = nativeJunitDirectory.get().dir('tmp').asFile
        systemProperty 'java.io.tmpdir', nativeTestTemp.absolutePath
        doFirst { testTask ->
            java.nio.file.Files.createDirectories(testTask.workingDir.toPath())
            java.nio.file.Files.createDirectories(nativeTestTemp.toPath())
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Language files are split per module under src/main/lang/<namespace>/*.json so modules never conflict;
// they are merged into assets/<namespace>/lang/en_us.json at build time.
def mergedLangDir = layout.buildDirectory.dir('generated/lang')
tasks.register('mergeLang') {
    inputs.dir 'src/main/lang'
    outputs.dir mergedLangDir
    doLast {
        project.delete(mergedLangDir) // a removed or renamed namespace must not linger in the jar
        def slurper = new groovy.json.JsonSlurper()
        file('src/main/lang').eachDir { nsDir ->
            def merged = new TreeMap<String, Object>()
            nsDir.eachFileMatch(~/.*\.json/) { f ->
                def parsed = slurper.parse(f, 'UTF-8')
                parsed.each { k, v ->
                    if (merged.containsKey(k) && merged[k] != v) logger.warn("Duplicate lang key ${k} in ${f.name}")
                    merged[k] = v
                }
            }
            def out = mergedLangDir.get().file("assets/${nsDir.name}/lang/en_us.json").asFile
            out.parentFile.mkdirs()
            out.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(merged)), 'UTF-8')
        }
    }
}
sourceSets.main.resources.srcDir(files(mergedLangDir).builtBy('mergeLang'))

// Camera reuse needs the dungeon/terrain builders too: a road-bake hash alone
// does not change when a cave ceiling or structure painter changes.
def generationIdentityDir = layout.buildDirectory.dir('generated/generation-identity')
def generationSources = fileTree('src/main/java/com/nirncraft') {
    include 'tamriel/**', 'worldplan/**', 'dungeons/**', 'roads/**', 'landmarks/**', 'scatter/**', 'worldgen/**'
    exclude '**/client/**'
}
def generationData = fileTree('src/main/resources') {
    include 'nirncraft/tamriel/**', 'nirncraft/dungeons/**', 'nirncraft/landmarks/**', 'nirncraft/scatter/**'
    include 'nirncraft/worldplan/**', 'nirncraft/roads/**', 'data/nirncraft/worldgen/**'
}
tasks.register('generationIdentity') {
    inputs.files generationSources, generationData
    outputs.dir generationIdentityDir
    doLast {
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        (generationSources.files + generationData.files).sort { a, b -> a.path <=> b.path }.each { f ->
            digest.update(project.relativePath(f).replace('\\', '/').getBytes('UTF-8'))
            digest.update(java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes))
        }
        def out = generationIdentityDir.get().file('nirncraft/generation-identity.txt').asFile
        out.parentFile.mkdirs()
        out.setText('v1:' + digest.digest().encodeHex().toString() + '\n', 'UTF-8')
    }
}
sourceSets.main.resources.srcDir(files(generationIdentityDir).builtBy('generationIdentity'))

// The far field's tiles (Infinite ATLAS) are a function of world generation and of the code that paints them: their
// cache is keyed by this identity, so any change to either starts a fresh cache by itself (nothing to remember).
def farIdentityDir = layout.buildDirectory.dir('generated/far-identity')
def farSources = fileTree('src/main/java/com/nirncraft/atlas') {
    include 'AtlasSurface.java', 'AtlasSnowCover.java', 'AtlasTileCodec.java', 'AtlasExactSource.java',
            'AtlasBiomes.java', 'AtlasGround.java', 'AtlasHeightGpu.java', 'AtlasTints.java'
}
tasks.register('farIdentity') {
    inputs.files generationSources, generationData, farSources
    outputs.dir farIdentityDir
    doLast {
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        (generationSources.files + generationData.files + farSources.files).sort { a, b -> a.path <=> b.path }.each { f ->
            digest.update(project.relativePath(f).replace('\\', '/').getBytes('UTF-8'))
            digest.update(java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes))
        }
        def out = farIdentityDir.get().file('nirncraft/far-identity.txt').asFile
        out.parentFile.mkdirs()
        out.setText('v1:' + digest.digest().encodeHex().toString() + '\n', 'UTF-8')
    }
}
sourceSets.main.resources.srcDir(files(farIdentityDir).builtBy('farIdentity'))

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation "net.neoforged:testframework:${neo_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    maxHeapSize = '2G'
    outputs.upToDateWhen { false }
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "short"
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version: neo_version, neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }
    // reproducible jars: the modpack only changes when the code does
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    // Minecraft26.3 is unobfuscated; ModDevGradle builds the runtime jar directly.
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '10000']
}

eclipse {
    jdt {
        file {
            withProperties { props ->
                props['org.eclipse.jdt.core.compiler.problem.deprecation'] = 'ignore'
                props['org.eclipse.jdt.core.compiler.problem.deprecationInDeprecatedCode'] = 'disabled'
                props['org.eclipse.jdt.core.compiler.problem.deprecationWhenOverridingDeprecatedMethod'] = 'disabled'
                props['org.eclipse.jdt.core.compiler.problem.unusedWarningToken'] = 'ignore'
                props['org.eclipse.jdt.core.compiler.problem.unusedImport'] = 'ignore'
                props['org.eclipse.jdt.core.compiler.problem.unusedLocal'] = 'ignore'
                props['org.eclipse.jdt.core.compiler.problem.unusedPrivateMember'] = 'ignore'
                props['org.eclipse.jdt.core.compiler.problem.unusedParameter'] = 'ignore'
                props['org.eclipse.jdt.core.compiler.problem.rawTypeReference'] = 'ignore'
                props['org.eclipse.jdt.core.compiler.problem.uncheckedTypeOperation'] = 'ignore'
                props['org.eclipse.jdt.core.compiler.problem.deadCode'] = 'ignore'
                props['org.eclipse.jdt.core.compiler.problem.discouragedReference'] = 'ignore'
            }
        }
    }
}

