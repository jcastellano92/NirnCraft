# Skycraft Aether: Skycraft's own shader pack for Iris 1.11 (NeoForge 26.3). Near field shaded here (deferred:
# gbuffers -> deferred.fsh lighting -> composite.fsh water, fog, far field, shafts -> composite1.fsh bloom ->
# final.fsh tonemap); distant terrain, the curved cloud shell and far actors come from the mod's aether renderer.
clouds = off
sun = false
moon = true
oldLighting = false
underwaterOverlay = false
vignette = false

# aether's frame, registered by the Skycraft mod as dynamic textures (see docs/AETHER.md section 3)
customTexture.aetherColor = skycraft:aether/color
customTexture.aetherDepth = skycraft:aether/depth
# the sun map: distant occluders (mountains) and cloud shadows along the sun / moon (lib/lighting.glsl)
customTexture.aetherSunMap = skycraft:aether/sunmap
# the mod's live weather (WeatherFieldTexture): wind heading and storminess for the waves (lib/weather.glsl)
customTexture.weatherField = skycraft:textures/environment/weather_field.png
customTexture.weatherDyn = skycraft:textures/environment/weather_dynamics.png

# translucents write premultiplied colour into colortex5 and their surface info into colortex6 (unblended)
blend.gbuffers_water = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_water.colortex6 = off
blend.gbuffers_hand_water = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand_water.colortex6 = off
blend.gbuffers_textured = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_textured_lit = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_weather = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_spidereyes = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_beaconbeam = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
# the G-buffer is written, never blended
blend.gbuffers_terrain = off
blend.gbuffers_entities = off
blend.gbuffers_block = off
blend.gbuffers_hand = off
blend.gbuffers_basic = off
blend.gbuffers_skytextured = off

# hardware tiers: LOW keeps the lighting, fog and far field; each tier above adds what shows most next
profile.LOW = shadowMapResolution=1024 shadowDistance=64.0 SHADOW_TAPS=4 !SSAO !SSR !VOLUMETRIC_LIGHT !BLOOM !AURORA \
  !CAUSTICS !FOLIAGE_SSS !PBR_MAPS WATER_WAVES=1 STARS !FOG_LAYERS
profile.MEDIUM = shadowMapResolution=2048 shadowDistance=96.0 SHADOW_TAPS=8 SSAO SSAO_SAMPLES=4 !SSR VOLUMETRIC_LIGHT \
  VL_SAMPLES=8 BLOOM AURORA CAUSTICS FOLIAGE_SSS PBR_MAPS WATER_WAVES=2 STARS FOG_LAYERS
profile.HIGH = shadowMapResolution=2048 shadowDistance=128.0 SHADOW_TAPS=12 SSAO SSAO_SAMPLES=6 SSR SSR_STEPS=20 \
  VOLUMETRIC_LIGHT VL_SAMPLES=16 BLOOM AURORA CAUSTICS FOLIAGE_SSS PBR_MAPS WATER_WAVES=2 STARS FOG_LAYERS
profile.ULTRA = shadowMapResolution=4096 shadowDistance=192.0 SHADOW_TAPS=20 SSAO SSAO_SAMPLES=12 SSR SSR_STEPS=32 \
  VOLUMETRIC_LIGHT VL_SAMPLES=32 BLOOM AURORA CAUSTICS FOLIAGE_SSS PBR_MAPS WATER_WAVES=3 STARS FOG_LAYERS

screen = <profile> EXPOSURE [Atmosphere] [Water] [Materials] [Shadows] [Aether]
screen.Atmosphere = CURVATURE PLANET_RADIUS sunPathRotation FOG_LAYERS VOLUMETRIC_LIGHT VL_SAMPLES STARS AURORA BLOOM
screen.Water = WATER_WAVES WATER_ALPHA REFRACTION SSR SSR_STEPS SHORE_FOAM CAUSTICS
screen.Materials = PBR_MAPS SPECULAR FOLIAGE_SSS SSAO SSAO_SAMPLES WAVING_FOLIAGE WIND_STRENGTH
screen.Shadows = SHADOWS shadowMapResolution shadowDistance SHADOW_DISTORT SHADOW_TAPS SHADOW_SOFTNESS
screen.Aether = AETHER_FAR_FIELD AETHER_HANDOFF_BAND
sliders = EXPOSURE WATER_ALPHA PLANET_RADIUS AETHER_HANDOFF_BAND shadowMapResolution shadowDistance SHADOW_DISTORT \
  sunPathRotation SHADOW_TAPS SHADOW_SOFTNESS SSAO_SAMPLES WIND_STRENGTH WATER_WAVES SSR_STEPS VL_SAMPLES
