# Skycraft Aether: Skycraft's own shader pack for Iris 1.11 (NeoForge 26.3). Near field shaded here; distant
# terrain, the curved cloud shell and far actors come from the Skycraft mod's aether renderer.
clouds = off
sun = false
moon = true
oldLighting = false
underwaterOverlay = false
vignette = false

# aether's frame, registered by the Skycraft mod as dynamic textures (see docs/AETHER.md section 3)
customTexture.aetherColor = skycraft:aether/color

screen = EXPOSURE WATER_ALPHA [Atmosphere] [Aether] [Shadows]
screen.Atmosphere = CURVATURE PLANET_RADIUS sunPathRotation
screen.Aether = AETHER_FAR_FIELD AETHER_HANDOFF_BAND
screen.Shadows = SHADOWS shadowMapResolution shadowDistance SHADOW_DISTORT
sliders = EXPOSURE WATER_ALPHA PLANET_RADIUS AETHER_HANDOFF_BAND shadowMapResolution shadowDistance SHADOW_DISTORT sunPathRotation
