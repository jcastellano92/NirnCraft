# NirnCraft Atlas: NirnCraft's own shader pack for Iris 1.11 (NeoForge 26.3). Near field shaded here (deferred:
# gbuffers -> deferred.fsh lighting -> composite.fsh water, fog, far field, shafts -> composite1.fsh shafts, bloom,
# the eye's exposure -> final.fsh exposure, tonemap); distant terrain, the curved cloud shell and far actors come
# from the mod's atlas renderer.
clouds = off
sun = false
moon = true
oldLighting = false
underwaterOverlay = false
vignette = false

# atlas's frame, registered by the NirnCraft mod as dynamic textures (see docs/ATLAS.md section 3)
customTexture.atlasColor = nirncraft:atlas/color
customTexture.atlasDepth = nirncraft:atlas/depth
# the sun map: distant occluders (mountains) and cloud shadows along the sun / moon (lib/lighting.glsl)
customTexture.atlasSunMap = nirncraft:atlas/sunmap
# the mod's live weather (WeatherFieldTexture): wind heading and storminess for the waves (lib/weather.glsl)
customTexture.weatherField = nirncraft:textures/environment/weather_field.png
customTexture.weatherDyn = nirncraft:textures/environment/weather_dynamics.png
# Masser's and Secunda's 16-phase atlases (lib/celestial.glsl)
customTexture.masserPhases = nirncraft:textures/environment/masser_phases.png
customTexture.secundaPhases = nirncraft:textures/environment/secunda_phases.png
# the night's key moon is not always Iris' shadow light: casters are turned (shadow.vsh), so keep them all
#ifdef LUNAR_KEY
shadow.culling = false
#endif
# the mod's local air, smoke, storm and horizon data (lib/modtex.glsl decodes each; blanks without the mod)
customTexture.fogRadianceTex = nirncraft:textures/environment/fog_radiance.png
customTexture.smokeSourcesTex = nirncraft:textures/environment/smoke_sources.png
customTexture.lightningTex = nirncraft:textures/environment/lightning_sources.png
customTexture.localOcclusionTex = nirncraft:textures/environment/local_occlusion.png
customTexture.sunHorizonTex = nirncraft:textures/environment/sun_horizon.png
# adaptive quality v2: the mod's controller's continuous knobs (lib/quality.glsl, docs/ADAPTIVE-QUALITY.md)
customTexture.qualityKnobs = nirncraft:textures/environment/quality.png
# the pack's own regional film grades (shaderpack/tools/bake_grades.py, lib/grade.glsl)
customTexture.gradeLut = textures/grade_lut.png
customTexture.gradeMap = textures/grade_map.png

# translucents write premultiplied colour into colortex5 and their surface info into colortex6 (unblended)
blend.gbuffers_water = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_water.colortex6 = off
blend.gbuffers_hand_water = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand_water.colortex6 = off
blend.gbuffers_textured = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_textured_lit = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_weather = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_spidereyes = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_beaconbeam = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
# drawn after deferred (Iris' translucent phase): translucent entities (26.3 avatar bodies) and block entities, lit
# forward; their colortex6 (surface info) replaces the water's where they stand in front of it
blend.gbuffers_entities_translucent = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_entities_translucent.colortex6 = off
blend.gbuffers_block_translucent = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_block_translucent.colortex6 = off
blend.gbuffers_lightning = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
# untextured geometry (lightning channels, the mod's POSITION_COLOR quads, outlines, leads): forward, premultiplied
blend.gbuffers_basic = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
# the G-buffer is written, never blended
blend.gbuffers_terrain = off
blend.gbuffers_entities = off
blend.gbuffers_block = off
blend.gbuffers_hand = off
blend.gbuffers_skytextured = off
# realms (shaders/realm/): the realm's own sky dome and sprites, premultiplied into colortex7
blend.gbuffers_skytextured.colortex7 = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_skybasic = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA

# hardware tiers: LOW keeps the lighting, fog and far field; each tier above adds what shows most next. ADAPTIVE (the
# defaults) gives the mod's quality controller ULTRA's loop ceilings to scale within (HIGH's maps and switches); the
# fixed tiers are ceilings it scales down from, and run their own counts without the mod
profile.ADAPTIVE = QUALITY_FALLBACK=0.65 ADAPTIVE_QUALITY shadowMapResolution=2048 shadowDistance=128.0 SHADOW_TAPS=20 \
  SSAO SSAO_SAMPLES=12 SSR SSR_STEPS=32 VOLUMETRIC_LIGHT SHAFT_MARCH VL_SAMPLES=20 BLOOM AURORA CAUSTICS FOLIAGE_SSS PBR_MAPS POM POM_STEPS=24 POM_DISTANCE=24.0 \
  WATER_WAVES=3 STARS FOG_LAYERS \
  FALLBACK_CLOUDS=2 EMISSIVE_STRENGTH=4.0 \
  MEDIA_STEPS=16 HALO_STEPS=12 LIGHTNING_LIGHT=1 !LIGHT_OCCLUSION \
  COLORED_LIGHT BLOCKLIGHT_FLICKER=1 SUN_HORIZON_TAPS=6 \
  PLUME_STEPS=16 SMOKE_FIRE_VOLUMES=12 \
  WATER_FLOW FALLS_MIST \
  MOD_SKY LUNAR_KEY \
  WEATHER_SKY
profile.LOW = QUALITY_FALLBACK=1.0 shadowMapResolution=1024 shadowDistance=64.0 SHADOW_TAPS=4 !SSAO !SSR VOLUMETRIC_LIGHT !SHAFT_MARCH VL_SAMPLES=6 !BLOOM !AURORA \
  !CAUSTICS !FOLIAGE_SSS !PBR_MAPS !POM WATER_WAVES=1 STARS !FOG_LAYERS \
  FALLBACK_CLOUDS=1 EMISSIVE_STRENGTH=3.0 \
  MEDIA_STEPS=4 HALO_STEPS=0 LIGHTNING_LIGHT=1 !LIGHT_OCCLUSION \
  !COLORED_LIGHT BLOCKLIGHT_FLICKER=1 SUN_HORIZON_TAPS=4 \
  PLUME_STEPS=6 SMOKE_FIRE_VOLUMES=2 \
  WATER_FLOW !FALLS_MIST \
  MOD_SKY !LUNAR_KEY \
  WEATHER_SKY
profile.MEDIUM = QUALITY_FALLBACK=1.0 shadowMapResolution=2048 shadowDistance=96.0 SHADOW_TAPS=8 SSAO SSAO_SAMPLES=4 !SSR VOLUMETRIC_LIGHT \
  SHAFT_MARCH VL_SAMPLES=8 BLOOM AURORA CAUSTICS FOLIAGE_SSS PBR_MAPS POM POM_STEPS=8 POM_DISTANCE=12.0 WATER_WAVES=2 STARS FOG_LAYERS \
  FALLBACK_CLOUDS=2 EMISSIVE_STRENGTH=4.0 \
  MEDIA_STEPS=6 HALO_STEPS=6 LIGHTNING_LIGHT=1 !LIGHT_OCCLUSION \
  COLORED_LIGHT BLOCKLIGHT_FLICKER=1 SUN_HORIZON_TAPS=6 \
  PLUME_STEPS=6 SMOKE_FIRE_VOLUMES=4 \
  WATER_FLOW FALLS_MIST \
  MOD_SKY LUNAR_KEY \
  WEATHER_SKY
profile.HIGH = QUALITY_FALLBACK=1.0 shadowMapResolution=2048 shadowDistance=128.0 SHADOW_TAPS=12 SSAO SSAO_SAMPLES=6 SSR SSR_STEPS=20 \
  VOLUMETRIC_LIGHT SHAFT_MARCH VL_SAMPLES=12 BLOOM AURORA CAUSTICS FOLIAGE_SSS PBR_MAPS POM POM_STEPS=16 POM_DISTANCE=16.0 WATER_WAVES=2 STARS FOG_LAYERS \
  FALLBACK_CLOUDS=2 EMISSIVE_STRENGTH=4.0 \
  MEDIA_STEPS=10 HALO_STEPS=8 LIGHTNING_LIGHT=1 !LIGHT_OCCLUSION \
  COLORED_LIGHT BLOCKLIGHT_FLICKER=1 SUN_HORIZON_TAPS=6 \
  PLUME_STEPS=10 SMOKE_FIRE_VOLUMES=8 \
  WATER_FLOW FALLS_MIST \
  MOD_SKY LUNAR_KEY \
  WEATHER_SKY
profile.ULTRA = QUALITY_FALLBACK=1.0 shadowMapResolution=4096 shadowDistance=192.0 SHADOW_TAPS=20 SSAO SSAO_SAMPLES=12 SSR SSR_STEPS=32 \
  VOLUMETRIC_LIGHT SHAFT_MARCH VL_SAMPLES=20 BLOOM AURORA CAUSTICS FOLIAGE_SSS PBR_MAPS POM POM_STEPS=24 POM_DISTANCE=24.0 WATER_WAVES=3 STARS FOG_LAYERS \
  FALLBACK_CLOUDS=2 EMISSIVE_STRENGTH=4.0 \
  MEDIA_STEPS=16 HALO_STEPS=12 LIGHTNING_LIGHT=1 LIGHT_OCCLUSION \
  COLORED_LIGHT BLOCKLIGHT_FLICKER=1 SUN_HORIZON_TAPS=6 \
  PLUME_STEPS=16 SMOKE_FIRE_VOLUMES=23 \
  WATER_FLOW FALLS_MIST \
  MOD_SKY LUNAR_KEY \
  WEATHER_SKY

screen = <profile> EXPOSURE AUTO_EXPOSURE NIGHT_VISION REGION_GRADE GRADE_STRENGTH ADAPTIVE_QUALITY QUALITY_FALLBACK [Atmosphere] [Air] [Water] [Materials] [Shadows] [Atlas]
screen.Atmosphere = CURVATURE PLANET_RADIUS sunPathRotation FOG_LAYERS VOLUMETRIC_LIGHT SHAFT_MARCH VL_SAMPLES STARS AURORA MOD_SKY LUNAR_KEY WEATHER_SKY BLOOM \
  FALLBACK_CLOUDS EMISSIVE_STRENGTH
screen.Air = MEDIA_STEPS HALO_STEPS LIGHTNING_LIGHT LIGHT_OCCLUSION PLUME_STEPS SMOKE_FIRE_VOLUMES
screen.Water = WATER_WAVES WATER_ALPHA REFRACTION SSR SSR_STEPS SHORE_FOAM CAUSTICS WATER_FLOW FALLS_MIST
screen.Materials = PBR_MAPS POM POM_STEPS POM_DEPTH POM_DISTANCE SPECULAR FOLIAGE_SSS SSAO SSAO_SAMPLES WAVING_FOLIAGE WIND_STRENGTH COLORED_LIGHT \n  BLOCKLIGHT_FLICKER
screen.Shadows = SUN_HORIZON_TAPS SHADOWS shadowMapResolution shadowDistance SHADOW_DISTORT SHADOW_TAPS SHADOW_SOFTNESS
screen.Atlas = ATLAS_FAR_FIELD ATLAS_HANDOFF_BAND
sliders = NIGHT_VISION GRADE_STRENGTH SMOKE_FIRE_VOLUMES POM_STEPS POM_DEPTH POM_DISTANCE QUALITY_FALLBACK PLUME_STEPS BLOCKLIGHT_FLICKER SUN_HORIZON_TAPS MEDIA_STEPS HALO_STEPS LIGHTNING_LIGHT FALLBACK_CLOUDS EMISSIVE_STRENGTH EXPOSURE WATER_ALPHA PLANET_RADIUS ATLAS_HANDOFF_BAND shadowMapResolution shadowDistance SHADOW_DISTORT \
  sunPathRotation SHADOW_TAPS SHADOW_SOFTNESS SSAO_SAMPLES WIND_STRENGTH WATER_WAVES SSR_STEPS VL_SAMPLES
