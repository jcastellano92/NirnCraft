name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mod:
    name: Skycraft Core mod
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          set -o pipefail
          ./gradlew build 2>&1 | tee build.log
      - name: Compile error summary
        if: failure()
        run: |
          grep -E "\.java:[0-9]+: error:" -A2 build.log | head -400 || true
          echo "Total errors: $(grep -cE '\.java:[0-9]+: error:' build.log)"
          grep -E "FAILURE|What went wrong" -A6 build.log | head -40 || true
      - uses: actions/upload-artifact@v4
        with:
          name: skycraft-core-jar
          path: mod/build/libs/*.jar

  pack:
    name: Modpack (resolve, export, client & server packs)
    needs: mod
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install packwiz
        # Pinned: packwiz has no releases, and @latest can start needing a newer Go at any time.
        env:
          GOTOOLCHAIN: local
        run: go install github.com/packwiz/packwiz@v0.0.0-20260906154125-ef87d964f8cb && echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: skycraft-core-jar
          path: mod-jar
      - name: Locate Skycraft Core jar
        run: |
          JAR="$(ls mod-jar/*.jar | grep -v -- '-sources' | head -n1)"
          test -n "$JAR" && echo "CORE_JAR=$PWD/$JAR" >> "$GITHUB_ENV"
      - name: Resolve mods
        # Fails if any tools/modlist.txt entry can't be resolved. Skycraft Core is not part of the committed pack.
        run: bash tools/build-pack.sh
      - name: Build client instance and server
        # Also creates dist/pack-build: the pack with Skycraft Core injected (tools/prepare-build-pack.sh).
        run: bash tools/make-instances.sh "$CORE_JAR"
      - name: Export Modrinth & CurseForge packs
        working-directory: dist/pack-build
        run: |
          packwiz modrinth export -o ../Skycraft.mrpack \
            || echo "::warning::Modrinth export (Skycraft.mrpack) failed; see the log above."
          packwiz curseforge export -o ../Skycraft-curseforge.zip \
            || echo "::warning::CurseForge export failed (Modrinth-only mods can't be referenced); see the log above."
      - name: Server smoke test (boot the full pack and generate the world)
        timeout-minutes: 30
        run: bash tools/test-server.sh
      - name: Client smoke test (Skycraft dev client under Xvfb with software GL)
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libgl1 libgl1-mesa-dri
          bash tools/test-client.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-test-logs
          path: dist/server-test
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-test-logs
          path: dist/client-test
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Skycraft-client-instance
          path: dist/Skycraft-client-instance.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Skycraft-server
          path: dist/Skycraft-server.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Skycraft-exports
          if-no-files-found: warn
          path: |
            dist/Skycraft.mrpack
            dist/Skycraft-curseforge.zip
            pack/RESOLVE_REPORT.md
